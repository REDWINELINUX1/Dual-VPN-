name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build and prepare libbox automatically
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          rm -rf sbox_source
          git clone https://github.com/SagerNet/sing-box.git sbox_source
          cd sbox_source
          go install github.com/sagerNet/gomobile/cmd/gomobile@latest
          go install github.com/sagerNet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          make lib_android
          cp libbox.aar ../libbox.aar
          cd ..
          unzip -q libbox.aar -d libbox_temp
          cp libbox_temp/classes.jar app/libs/libbox.jar
          if [ -d "libbox_temp/jni" ]; then
            cp -r libbox_temp/jni/* app/src/main/jniLibs/
          fi
          rm -rf sbox_source libbox_temp libbox.aar

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
