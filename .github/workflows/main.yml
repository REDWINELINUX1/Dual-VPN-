name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.9"

      - name: Download libbox.aar automatically
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/libbox.aar "https://github.com/SagerNet/sing-box-for-android/raw/androidx/app/libs/libbox.aar"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
