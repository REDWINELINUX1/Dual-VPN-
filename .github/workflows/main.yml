name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-mb: 4096

      - name: Set up Android NDK r26
        run: |
          ANDROID_NDK_VERSION="26.1.10909125"
          NDK_ZIP="android-ndk-r26b-linux.zip"
          curl -O https://dl.google.com/android/repository/$NDK_ZIP
          unzip -q $NDK_ZIP
          mkdir -p $ANDROID_HOME/ndk/$ANDROID_NDK_VERSION
          mv android-ndk-r26b/* $ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/
          rm -rf $NDK_ZIP android-ndk-r26b
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build libbox locally
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          rm -rf sbox_source
          git clone https://github.com/SagerNet/sing-box.git sbox_source
          cd sbox_source
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          make lib_android
          cp libbox.aar ../libbox.aar
          cd ..
          unzip -q libbox.aar -d libbox_temp
          cp libbox_temp/classes.jar app/libs/libbox.jar
          if [ -d "libbox_temp/jni" ]; then
            cp -r libbox_temp/jni/* app/src/main/jniLibs/
          fi
          rm -rf sbox_source libbox_temp libbox.aar

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
