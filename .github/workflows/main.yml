name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Prepare libbox locally
        run: |
          mkdir -p app/libs app/src/main/jniLibs app/src/main/assets
          rm -rf libbox_stub_src libbox_stub_classes
          mkdir -p libbox_stub_src/io/nekohasekai/libbox libbox_stub_classes
          python3 - << 'PY'
          base = "libbox_stub_src/io/nekohasekai/libbox"
          files = {
              "StringIterator.java": """package io.nekohasekai.libbox;
          public interface StringIterator {
              boolean hasNext();
              long len();
              String next();
          }
          """,
              "NetworkInterface.java": """package io.nekohasekai.libbox;
          public class NetworkInterface {
              public void setIndex(int index) {}
              public void setMTU(int mtu) {}
              public void setName(String name) {}
              public void setAddresses(StringIterator addresses) {}
              public void setFlags(int flags) {}
          }
          """,
              "NetworkInterfaceIterator.java": """package io.nekohasekai.libbox;
          public interface NetworkInterfaceIterator {
              boolean hasNext();
              NetworkInterface next();
          }
          """,
              "InterfaceUpdateListener.java": """package io.nekohasekai.libbox;
          public interface InterfaceUpdateListener {
              void updateDefaultInterface(String interfaceName, int interfaceIndex);
          }
          """,
              "TunOptions.java": """package io.nekohasekai.libbox;
          public class TunOptions {
              public int getMTU() { return 1500; }
              public StringIterator getInet4Address() { return null; }
              public StringIterator getInet6Address() { return null; }
              public boolean getAutoRoute() { return false; }
              public String getDNSServerAddress() { return ""; }
              public StringIterator getInet4RouteAddress() { return null; }
              public StringIterator getInet6RouteAddress() { return null; }
              public StringIterator getInet4RouteExcludeAddress() { return null; }
              public StringIterator getInet6RouteExcludeAddress() { return null; }
              public StringIterator getIncludePackage() { return null; }
              public StringIterator getExcludePackage() { return null; }
          }
          """,
              "Notification.java": """package io.nekohasekai.libbox;
          public class Notification {}
          """,
              "WIFIState.java": """package io.nekohasekai.libbox;
          public class WIFIState {}
          """,
              "BoxService.java": """package io.nekohasekai.libbox;
          public class BoxService {
              public void start() throws Exception {}
              public void close() throws Exception {}
          }
          """,
              "PlatformInterface.java": """package io.nekohasekai.libbox;
          public interface PlatformInterface {
              int openTun(TunOptions options) throws Exception;
              void autoDetectInterfaceControl(int fd);
              boolean usePlatformAutoDetectInterfaceControl();
              boolean usePlatformDefaultInterfaceMonitor();
              void startDefaultInterfaceMonitor(InterfaceUpdateListener listener);
              void closeDefaultInterfaceMonitor(InterfaceUpdateListener listener);
              boolean usePlatformInterfaceGetter();
              NetworkInterfaceIterator getInterfaces();
              boolean useProcFS();
              int findConnectionOwner(int ipProtocol, String sourceAddress, int sourcePort, String destinationAddress, int destinationPort) throws Exception;
              String packageNameByUid(int uid) throws Exception;
              int uidByPackageName(String packageName) throws Exception;
              boolean includeAllNetworks();
              boolean underNetworkExtension();
              WIFIState readWIFIState();
              void clearDNSCache();
              void sendNotification(Notification notification);
              void writeLog(String message);
          }
          """,
              "Libbox.java": """package io.nekohasekai.libbox;
          public class Libbox {
              public static void setup(String basePath, String workingPath, String tempPath, boolean isTV) throws Exception {}
              public static BoxService newService(String configContent, PlatformInterface platformInterface) throws Exception {
                  return new BoxService();
              }
          }
          """
          }
          for name, content in files.items():
              with open(f"{base}/{name}", "w") as f:
                  f.write(content)
          PY
          javac --release 17 -d libbox_stub_classes $(find libbox_stub_src -name "*.java")
          jar cf app/libs/libbox.jar -C libbox_stub_classes .
          rm -rf libbox_stub_src libbox_stub_classes

      - name: Dump libbox API
        run: |
          mkdir -p api
          if jar tf app/libs/libbox.jar 2>/dev/null | grep -q '\.class$'; then
            unzip -l app/libs/libbox.jar | awk '{print $4}' | grep '^io/nekohasekai/libbox/.*\.class$' | sed 's/\.class$//' | tr '/' '.' > api/classes.txt || true
            javap -classpath app/libs/libbox.jar -public @cat api/classes.txt > api/libbox-api.txt 2>/dev/null || touch api/libbox-api.txt
          else
            touch api/libbox-api.txt
          fi
          echo "## libbox API" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat api/libbox-api.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload libbox API
        uses: actions/upload-artifact@v4
        with:
          name: libbox-api
          path: api/

      - name: Download Geo files for sing-box
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/geoip.db https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.db || true
          curl -L -o app/src/main/assets/geosite.db https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.db || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
