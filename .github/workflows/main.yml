name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download libbox prebuilt
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          # دانلود آخرین نسخه libbox.aar مستقیماً از مخزن اصلی
          curl -L -o libbox.aar "https://github.com/SagerNet/sing-box/releases/latest/download/libbox-android.aar" || \
          curl -L -o libbox.aar "https://github.com/SagerNet/sing-box/releases/download/v1.11.0/libbox-android.aar"
          
          unzip -q libbox.aar -d libbox_temp
          cp libbox_temp/classes.jar app/libs/libbox.jar
          if [ -d "libbox_temp/jni" ]; then
            cp -r libbox_temp/jni/* app/src/main/jniLibs/
          fi
          rm -rf libbox_temp libbox.aar

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
