name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "app/libs/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify real libbox dependency
        run: |
          set -euo pipefail
          if [ ! -s app/libs/libbox.aar ]; then
            echo "::error::The official sing-box libbox.aar is required at app/libs/libbox.aar."
            exit 1
          fi
          echo "e37e0cdf93e9653b73d42fedf746987922a3367f77d78ea6e457478edbda8a15  app/libs/libbox.aar" | sha256sum --check
          tmp_dir=$(mktemp -d)
          unzip -Z1 app/libs/libbox.aar | grep -Fxq "jni/arm64-v8a/libbox.so"
          unzip -q app/libs/libbox.aar classes.jar -d "$tmp_dir"
          javap -classpath "$tmp_dir/classes.jar" io.nekohasekai.libbox.CommandServer >/dev/null
          javap -classpath "$tmp_dir/classes.jar" io.nekohasekai.libbox.PlatformInterface >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
